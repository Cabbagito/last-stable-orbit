<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dice icons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09080c}
</style>
</helmet>
<div style="width: 940px; height: 680px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 28px; background: #09080c; color: #ece8f2; font-family: 'Space Grotesk', system-ui, sans-serif;">
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px;">
<sc-for list="{{dice}}" as="d" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 10px;">
<div style="width: 112px; height: 112px; display: flex; align-items: center; justify-content: center; background: #0b0a0f; border: 1px solid #221e2a; border-radius: 6px;">
<img src="{{d.big}}" alt="{{d.name}}" style="display: block; width: 96px; height: 96px; image-rendering: pixelated;">
</div>
<div style="display: flex; align-items: flex-end; gap: 12px;">
<img src="{{d.big}}" alt="" style="display: block; width: 48px; height: 48px; image-rendering: pixelated;">
<img src="{{d.small}}" alt="" style="display: block; width: 28px; height: 28px; image-rendering: pixelated;">
</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px;">
<span style="width: 80px; flex: none; font-family: 'Silkscreen', monospace; font-size: 11px; color: #ece8f2;">{{r.name}}</span>
<div style="display: flex; gap: 14px;">
<sc-for list="{{r.dice}}" as="c" hint-placeholder-count="6">
<img src="{{c.src}}" alt="" style="display: block; width: 48px; height: 48px; image-rendering: pixelated;">
</sc-for>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
