<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item icons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09080c}
</style>
</helmet>
<div style="width: 940px; height: 480px; box-sizing: border-box; padding: 40px; background: #09080c; color: #ece8f2; font-family: 'Space Grotesk', system-ui, sans-serif;">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 20px;">
<sc-for list="{{items}}" as="s" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: flex-end; gap: 14px;">
<div style="width: 112px; height: 112px; flex: none; display: flex; align-items: center; justify-content: center; background: #0b0a0f; border: 1px solid #221e2a; border-radius: 6px;">
<img src="{{s.src}}" alt="{{s.name}} icon" style="display: block; width: 96px; height: 96px; image-rendering: pixelated;">
</div>
<img src="{{s.src}}" alt="" style="display: block; width: 48px; height: 48px; image-rendering: pixelated;">
<img src="{{s.src}}" alt="" style="display: block; width: 24px; height: 24px;">
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-family: 'Silkscreen', monospace; font-size: 13px; color: #ffffff;">{{s.name}}</span>
<span style="font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 1px; color: #a9a2bc;">{{s.kind}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":940,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'SPLICE KIT', kind: 'TOOL', src: '/_blob/624ba83b18f3dce2046bb80c9eb5f369' },
        { name: 'EVAL_REPORT_v12', kind: 'CLUE', src: '/_blob/2702d4d8d535dfb3d159e6f6b283506a' },
        { name: 'VAULT 3 ACCESS CHIT', kind: 'KEY', src: '/_blob/f61d0ff4c00bbf2a8f84aa2a74cc8186' },
        { name: 'CREDITS', kind: 'CASH', src: '/_blob/345c318da5fa39d204c6c0aedc9bf057' },
        { name: 'LASER PISTOL', kind: 'WEAPON', src: '/_blob/c7a9d5b6ad52f454af2248bc98cc72ed' }
      ]
    };
  }
}
</script>
</body>
</html>
