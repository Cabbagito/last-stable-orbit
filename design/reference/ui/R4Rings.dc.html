<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ring options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.r3-px{image-rendering:pixelated;display:block}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; padding: 32px 36px; background: #000000; color: #f2f2f4; font-family: 'Geist', system-ui, sans-serif; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 44px 28px; align-content: center;">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="9">
<div style="display: flex; gap: 20px; align-items: center;">
<span style="position: relative; display: block; width: 216px; height: 216px; flex: none;"><img src="/_blob/e6071441b882bfcc677068003d8bb15d" alt="" class="r3-px" style="position: absolute; left: 12px; top: 12px; width: 192px; height: 192px; border-radius: 50%;"><svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;"><sc-for list="{{c.big.arcs}}" as="a" hint-placeholder-count="2"><path d="{{a.d}}" fill="none" stroke="{{a.c}}" stroke-width="{{a.w}}" stroke-linecap="{{a.cap}}" opacity="{{a.o}}"></path></sc-for><sc-for list="{{c.big.dots}}" as="q" hint-placeholder-count="0"><circle cx="{{q.x}}" cy="{{q.y}}" r="{{q.r}}" fill="{{q.f}}" stroke="{{q.c}}" stroke-width="{{q.w}}"></circle></sc-for></svg></span>
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0;">
<div><div style="font-weight: 600; font-size: 19px; color: #ffffff;">{{c.name}}</div><div style="color: #a0a0a8; font-size: 14px; line-height: 1.3;">{{c.note}}</div></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap;"><span style="position: relative; display: block; width: 64px; height: 64px; flex: none;"><img src="/_blob/dc1a093262f3347a48b05362bace7b6e" alt="" draggable="false"  style="position: absolute; left: {{c.a.p}}%; top: {{c.a.p}}%; width: {{c.a.d}}%; height: {{c.a.d}}%; border-radius: 50%; background: #000; pointer-events: none;"><svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;"><sc-for list="{{c.a.arcs}}" as="a" hint-placeholder-count="2"><path d="{{a.d}}" fill="none" stroke="{{a.c}}" stroke-width="{{a.w}}" stroke-linecap="{{a.cap}}" opacity="{{a.o}}"></path></sc-for><sc-for list="{{c.a.dots}}" as="q" hint-placeholder-count="0"><circle cx="{{q.x}}" cy="{{q.y}}" r="{{q.r}}" fill="{{q.f}}" stroke="{{q.c}}" stroke-width="{{q.w}}"></circle></sc-for></svg></span><span style="position: relative; display: block; width: 64px; height: 64px; flex: none;"><img src="/_blob/46800f055cd6c0e10837bb4ae6df661e" alt="" draggable="false"  style="position: absolute; left: {{c.b.p}}%; top: {{c.b.p}}%; width: {{c.b.d}}%; height: {{c.b.d}}%; border-radius: 50%; background: #000; pointer-events: none;"><svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;"><sc-for list="{{c.b.arcs}}" as="a" hint-placeholder-count="2"><path d="{{a.d}}" fill="none" stroke="{{a.c}}" stroke-width="{{a.w}}" stroke-linecap="{{a.cap}}" opacity="{{a.o}}"></path></sc-for><sc-for list="{{c.b.dots}}" as="q" hint-placeholder-count="0"><circle cx="{{q.x}}" cy="{{q.y}}" r="{{q.r}}" fill="{{q.f}}" stroke="{{q.c}}" stroke-width="{{q.w}}"></circle></sc-for></svg></span></div>
<div style="display: flex; gap: 8px;"><span style="position: relative; display: block; width: 64px; height: 64px; flex: none;"><img src="/_blob/35097f28e94ec04b3d9a0d76ffb3be93" alt="" draggable="false"  style="position: absolute; left: {{c.c.p}}%; top: {{c.c.p}}%; width: {{c.c.d}}%; height: {{c.c.d}}%; border-radius: 50%; background: #000; pointer-events: none;"><svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;"><sc-for list="{{c.c.arcs}}" as="a" hint-placeholder-count="2"><path d="{{a.d}}" fill="none" stroke="{{a.c}}" stroke-width="{{a.w}}" stroke-linecap="{{a.cap}}" opacity="{{a.o}}"></path></sc-for><sc-for list="{{c.c.dots}}" as="q" hint-placeholder-count="0"><circle cx="{{q.x}}" cy="{{q.y}}" r="{{q.r}}" fill="{{q.f}}" stroke="{{q.c}}" stroke-width="{{q.w}}"></circle></sc-for></svg></span><span style="position: relative; display: block; width: 64px; height: 64px; flex: none;"><img src="/_blob/8b2742d12aa2b84b941c77912fb08e77" alt="" draggable="false"  style="position: absolute; left: {{c.d.p}}%; top: {{c.d.p}}%; width: {{c.d.d}}%; height: {{c.d.d}}%; border-radius: 50%; background: #000; pointer-events: none;"><svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;"><sc-for list="{{c.d.arcs}}" as="a" hint-placeholder-count="2"><path d="{{a.d}}" fill="none" stroke="{{a.c}}" stroke-width="{{a.w}}" stroke-linecap="{{a.cap}}" opacity="{{a.o}}"></path></sc-for><sc-for list="{{c.d.dots}}" as="q" hint-placeholder-count="0"><circle cx="{{q.x}}" cy="{{q.y}}" r="{{q.r}}" fill="{{q.f}}" stroke="{{q.c}}" stroke-width="{{q.w}}"></circle></sc-for></svg></span></div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  // A ring is a list of SVG arcs and dots in a 100 x 100 box. HP and Entropy both count down: more lit is better.
  ring(kind, hp, en, px, band) {
    const u = 100 / px, big = px > 100;
    const G = '#5ee08c', AM = '#f2b544', OFF = 'rgba(255,255,255,.16)';
    const arcs = [], dots = [];
    const pt = (r, a) => { const t = a * Math.PI / 180; return [50 + r * Math.sin(t), 50 - r * Math.cos(t)]; };
    const f2 = (n) => Math.round(n * 100) / 100;
    const P = (p) => f2(p[0]) + ' ' + f2(p[1]);
    const arc = (r, a0, a1, c, w, cap, o) => {
      const seg = (x, y) => { const large = y - x > 180 ? 1 : 0; return 'A' + f2(r) + ' ' + f2(r) + ' 0 ' + large + ' 1 ' + P(pt(r, y)); };
      const d = a1 - a0 >= 359.9 ? 'M' + P(pt(r, a0)) + seg(a0, a0 + 180) + seg(a0 + 180, a0 + 360) : 'M' + P(pt(r, a0)) + seg(a0, a1);
      arcs.push({ d, c, w: f2(w * u), cap: cap || 'butt', o: o == null ? 1 : o });
    };
    const tick = (r0, len, a, c, w, o) => arcs.push({ d: 'M' + P(pt(r0, a)) + 'L' + P(pt(r0 - len * u, a)), c, w: f2(w * u), cap: 'butt', o: o == null ? 1 : o });
    const dot = (r, a, rad, f, c, w) => { const p = pt(r, a); dots.push({ x: f2(p[0]), y: f2(p[1]), r: f2(rad * u), f, c: c || 'none', w: f2((w || 0) * u) }); };
    if (kind === 'segments') {
      const t1 = big ? 5 : 3, t2 = big ? 3 : 2, r1 = 50 - t1 / 2 * u, r2 = r1 - (t1 / 2 + (big ? 3 : 2) + t2 / 2) * u;
      for (let i = 0; i < 6; i++) { arc(r1, i * 60 + 3.5, i * 60 + 56.5, i < hp ? G : '#2a2a31', t1); arc(r2, i * 60 + 3.5, i * 60 + 56.5, i < en ? AM : '#2a2a31', t2); }
    } else if (kind === 'hairline' || kind === 'ivory') {
      const s1 = big ? 2 : 1.5, s2 = big ? 1.25 : 1, r1 = 50 - s1 / 2 * u, r2 = r1 - (big ? 5 : 3.5) * u;
      const H = kind === 'ivory' ? '#efe9df' : G;
      arc(r1, 0, 360, OFF, .75); arc(r2, 0, 360, OFF, .75);
      if (kind === 'ivory') { for (let i = 0; i < hp; i++) arc(r1, i * 60 + 1.5, i * 60 + 58.5, H, s1); } else if (hp) arc(r1, 0, hp * 60, H, s1);
      if (en) arc(r2, 0, en * 60, AM, s2);
    } else if (kind === 'orbit') {
      const s = big ? 2.5 : 1.75, r1 = 50 - (s / 2 + (big ? 1 : .5)) * u, r2 = r1 - (big ? 7 : 4.5) * u;
      arc(r1, 0, 360, OFF, .75);
      if (hp) arc(r1, 2, hp * 60 - 2, G, s, 'round');
      arc(r2, 0, 360, 'rgba(255,255,255,.08)', .5);
      for (let i = 0; i < 6; i++) { if (i < en) dot(r2, i * 60, big ? 2.5 : 1.5, AM); else dot(r2, i * 60, big ? 1 : .75, 'rgba(255,255,255,.28)'); }
    } else if (kind === 'bezel') {
      const r0 = 50 - .5 * u, w = big ? 2 : 1.5, lh = big ? 10 : 6.5, le = big ? 6 : 4;
      if (big) for (let i = 0; i < 60; i++) if (i % 5) tick(r0, 2.5, i * 6, '#ffffff', .5, .22);
      for (let i = 0; i < 6; i++) {
        if (i < hp) tick(r0, lh, i * 60, G, w); else tick(r0, lh * .45, i * 60, OFF, w);
        if (i < en) tick(r0, le, i * 60 + 30, AM, w); else tick(r0, le * .45, i * 60 + 30, OFF, w);
      }
    } else if (kind === 'beads') {
      const r = 50 - (big ? 5 : 3.5) * u;
      for (let i = 0; i < 6; i++) {
        if (i < hp) dot(r, i * 60, big ? 4 : 2.4, G); else dot(r, i * 60, big ? 3.5 : 2, 'none', OFF, 1);
        if (i < en) dot(r, i * 60 + 30, big ? 2.5 : 1.6, AM); else dot(r, i * 60 + 30, big ? 2 : 1.25, 'none', OFF, .75);
      }
    } else if (kind === 'split') {
      const w = big ? 3 : 2, r = 50 - w / 2 * u, st = 164 / 6;
      for (let i = 0; i < 6; i++) {
        arc(r, 8 + i * st + 1.5, 8 + (i + 1) * st - 1.5, i < hp ? G : '#2a2a31', w);
        arc(r, 352 - (i + 1) * st + 1.5, 352 - i * st - 1.5, i < en ? AM : '#2a2a31', w);
      }
    } else if (kind === 'accretion') {
      const r = 50 - (big ? 2.5 : 1.5) * u, r2 = r - (big ? 6.5 : 4) * u, sw = hp * 60, n = 48;
      arc(r, 0, 360, 'rgba(255,255,255,.1)', .75);
      for (let i = 0; i < n && hp; i++) { const f = i / n; arc(r, f * sw, f * sw + sw / n + .7, G, (big ? 1 : .75) + (big ? 3 : 1.75) * f, 'butt', f2(.08 + .92 * Math.pow(f, 1.6))); }
      if (hp) dot(r, sw, big ? 2.75 : 1.6, '#d8ffe6');
      for (let i = 0; i < 6; i++) arc(r2, i * 60 + 18, i * 60 + 42, i < en ? AM : 'rgba(255,255,255,.14)', big ? 1.5 : 1);
    } else if (kind === 'capsule') {
      const w = big ? 4 : 2.5, r1 = 50 - (w / 2 + .5) * u, r2 = r1 - (w / 2 + (big ? 3 : 2)) * u;
      for (let i = 0; i < 6; i++) arc(r1, i * 60 + 9, i * 60 + 51, i < hp ? '#7fdca6' : '#26262c', w, 'round');
      arc(r2, 0, 360, 'rgba(255,255,255,.1)', .75);
      if (en) arc(r2, 0, en * 60, AM, big ? 1.5 : 1);
    }
    const p = band / px * 100;
    return { arcs, dots, p: f2(p), d: f2(100 - 2 * p) };
  }
  renderVals() {
    const K = [["segments", "Current", "What you have now, for comparison"], ["hairline", "Hairline", "Two fine continuous lines that drain"], ["ivory", "Ivory", "Hairline, with HP in ivory instead of green"], ["orbit", "Orbit", "HP as an orbit, Entropy as satellites on a second one"], ["bezel", "Bezel", "Watch ticks: long for HP, short for Entropy"], ["beads", "Beads", "One circle of jewels: large HP, small Entropy"], ["split", "Split", "One ring: HP down the right, Entropy down the left"], ["accretion", "Accretion", "HP as a bright head with a fading tail, like the disk"], ["capsule", "Capsule", "Soft rounded HP pills, a thin Entropy line inside"]];
    return { cells: K.map(([id, name, note]) => ({ name, note,
      big: this.ring(id, 4, 3, 216, 12), a: this.ring(id, 2, 5, 64, 9), b: this.ring(id, 6, 1, 64, 9), c: this.ring(id, 3, 2, 64, 9), d: this.ring(id, 1, 0, 64, 9) })) };
  }
}

</script>
</body>
</html>
