<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&amp;family=Doto:wght@800&amp;family=Hanken+Grotesk:ital,wght@0,400;0,500;1,400&amp;family=Jost:wght@200&amp;family=Michroma&amp;family=Silkscreen&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.r3-map{position:absolute;left:0;top:0;width:2560px;height:1440px;display:block;pointer-events:none;user-select:none;image-rendering:pixelated;transition:opacity .7s ease}
.r3-glow{position:absolute;left:0;top:0;width:2560px;height:1440px;pointer-events:none;mix-blend-mode:screen;transition:opacity .7s ease}
.r3-hum{display:block;width:2560px;height:1440px;user-select:none;animation:r3-hum 7s linear infinite}
@keyframes r3-hum{0%,100%{opacity:1}38%{opacity:1}38.6%{opacity:.62}39.2%{opacity:.96}40%{opacity:.74}40.8%{opacity:1}76%{opacity:.9}84%{opacity:1}}
.r3-tok{position:absolute;width:64px;height:100px;margin:-94px 0 0 -32px;background:none;border:0;padding:0;cursor:grab;font:inherit;transform-origin:32px 94px}
.r3-px{image-rendering:pixelated;display:block;flex:none}
.r4 :where(button){font:inherit;color:inherit}
.r4 button:focus-visible,.r4 a:focus-visible{outline:2px solid #fff;outline-offset:2px}
.r4{position:relative;height:100vh;min-height:760px;box-sizing:border-box;background:#000;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;font-family:var(--body);font-size:var(--bs);line-height:1.25}
.r4-head{display:flex;align-items:center;gap:28px;height:56px;flex:none;padding:0 16px}
.r4-tabs{display:flex;align-items:center}
.r4-tab{display:flex;align-items:center;height:44px;padding:0 12px;text-decoration:none;color:var(--dim);transition:color .15s}
.r4-tab:hover{color:#fff}
.r4-col{width:340px;flex:none;box-sizing:border-box;padding:8px 12px 12px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none}
.r4-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.r4-stat{background:var(--fill);border:1px solid var(--line);border-radius:var(--rad);padding:3px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .15s,background .15s}
.r4-stat:hover{border-color:var(--hover)}
.r4-stat:hover .r4-sdie{animation:r4-wig .5s ease}
.r4-sdie{transform-origin:50% 60%}
.r4-item{display:flex;align-items:center;gap:8px;min-height:50px;box-sizing:border-box;padding:0 10px 0 2px;background:var(--fill);border:1px solid var(--line);border-radius:var(--rad);color:var(--ink);line-height:1.1}
.r4-list{display:flex;flex-direction:column;gap:4px}
.r4-inv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.r4-chip{cursor:pointer;transition:border-color .15s,background .15s;background:var(--fill)}
.r4-chip:hover{border-color:var(--hover)}
.r4-chip.on{border-color:var(--accent);background:var(--chipon);color:#fff}
.r4-rail-name{color:var(--ink)}
.r4-rail-name.me{color:var(--accent)}
.r4-btn{background:var(--fill);border:1px solid var(--btnline);border-radius:var(--btnrad);color:var(--ink);min-height:44px;padding:0 18px;cursor:pointer;transition:border-color .15s,background .15s}
.r4-btn:hover{border-color:#fff}.r4-btn:disabled{opacity:.4;cursor:default}
.r4-cta{background:var(--ctabg);border:var(--ctaline);border-radius:var(--btnrad);color:var(--ctafg);min-height:56px;padding:0 44px;cursor:pointer;transition:filter .15s,background .15s}
.r4-cta:hover{filter:brightness(1.15)}.r4-cta:disabled{opacity:.35;cursor:default}
.r4-rung{width:124px;display:flex;flex-direction:column;gap:6px;color:var(--dim)}
.r4-rung.met{color:#fff}
.r4-die{display:block;image-rendering:pixelated;transition:width .16s ease,height .16s ease;transform-origin:50% 62%}
.jig0{animation:r4-jig-a .6s cubic-bezier(.3,1.4,.5,1)}
.jig1{animation:r4-jig-b .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes r4-jig-a{0%{transform:translateY(0) rotate(0) scale(.92)}18%{transform:translateY(-16px) rotate(-9deg) scale(1.06)}38%{transform:translateY(0) rotate(7deg) scale(1)}56%{transform:translateY(-5px) rotate(-5deg)}74%{transform:translateY(0) rotate(3deg)}88%{transform:rotate(-1.5deg)}100%{transform:none}}
@keyframes r4-jig-b{0%{transform:translateY(0) rotate(0) scale(.92)}18%{transform:translateY(-16px) rotate(-9deg) scale(1.06)}38%{transform:translateY(0) rotate(7deg) scale(1)}56%{transform:translateY(-5px) rotate(-5deg)}74%{transform:translateY(0) rotate(3deg)}88%{transform:rotate(-1.5deg)}100%{transform:none}}
@keyframes r4-wig{0%,100%{transform:none}25%{transform:rotate(-6deg)}50%{transform:rotate(5deg) translateY(-2px)}75%{transform:rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){.r3-hum,.jig0,.jig1,.r4-stat:hover .r4-sdie{animation:none}}

/* S4 Meridian: wide retro-futurist caps, film interface restraint */
.th-meridian{--ink:#e7e9ec;--dim:#8a8e96;--line:#1e2024;--hover:#5e626a;--fill:#000;--rad:0;--accent:#ff4fa3;--chipon:#180c13;--body:'Hanken Grotesk',system-ui,sans-serif;--bs:14.5px;--btnline:#2f3238;--btnrad:0;--ctabg:#000;--ctafg:#ff7dbb;--ctaline:1px solid #ff4fa3}
.th-meridian .r4-title{font-family:'Michroma',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#fff}
.th-meridian .r4-tab{font-family:'Michroma',sans-serif;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:0 12px;position:relative;height:30px}
.th-meridian .r4-tab.on{color:#fff;background:linear-gradient(#ff4fa3,#ff4fa3) 0 0/7px 1px no-repeat,linear-gradient(#ff4fa3,#ff4fa3) 0 0/1px 7px no-repeat,linear-gradient(#ff4fa3,#ff4fa3) 100% 100%/7px 1px no-repeat,linear-gradient(#ff4fa3,#ff4fa3) 100% 100%/1px 7px no-repeat}
.th-meridian .r4-name{font-family:'Michroma',sans-serif;font-size:19px;letter-spacing:.02em;color:#fff;line-height:1.2}
.th-meridian .r4-place{font-family:'Michroma',sans-serif;font-size:26px;letter-spacing:.03em;text-transform:uppercase;color:#fff;line-height:1.15}
.th-meridian .r4-h{font-family:'Michroma',sans-serif;color:#fff;letter-spacing:.02em}
.th-meridian .r4-lab{font-family:'Michroma',sans-serif;font-size:7.5px;letter-spacing:.14em;color:#b4b8c0}
.th-meridian .r4-lab.on{color:#fff}
.th-meridian .r4-rail-name{font-family:'Michroma',sans-serif;font-size:7.5px;letter-spacing:.12em;text-transform:uppercase}
.th-meridian .r4-cta{font-family:'Michroma',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.th-meridian .r4-cta:hover{background:#ff4fa3;color:#000;filter:none}
.th-meridian .r4-btn{font-size:13px}

/* Round 5 */
.th-meridian .r4-place{font-family:'Jost',sans-serif;font-weight:200;font-size:38px;letter-spacing:.14em;text-transform:uppercase;color:#fff;line-height:1.05}
.r5-role{font-style:italic;color:#a9adb5}
.r5-sec{font-family:'Michroma',sans-serif;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#8a8e96}
.r5-rows{display:flex;flex-direction:column}
.r5-row{display:flex;align-items:center;gap:10px;min-height:48px;color:#eceef1;line-height:1.15;border-top:1px solid #1e2024}
.r5-row:last-child{border-bottom:1px solid #1e2024}
.r5-items{display:flex;gap:10px}
.r5-table{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#1e2024;border:1px solid #1e2024}
.r5-cell{background:#000;border:0;padding:4px 0 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .15s}
.r5-cell:hover{background:#101114}
.r5-cell:hover .r4-sdie,.r5-srow:hover .r4-sdie,.r5-node:hover .r4-sdie{animation:r4-wig .5s ease}
.r5-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
.r5-tile{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:13px;line-height:1.15;color:#eceef1}
.r5-srow{display:flex;align-items:center;width:100%;background:none;border:0;border-top:1px solid #1e2024;padding:1px 0;cursor:pointer;transition:background .15s}
.r5-srow:last-child{border-bottom:1px solid #1e2024}
.r5-srow:hover{background:#101114}
.r5-strip{display:flex;align-items:stretch;flex:none;height:76px;border-top:1px solid #1e2024;background:#000}
.r5-scell{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;border-left:1px solid #1e2024;line-height:1.15;color:#eceef1}
.r5-scell:first-child{border-left:0}
.r5-node{position:absolute;width:96px;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.r5-node:hover .r4-lab{color:#fff}
.r5-tip{position:relative;display:block;flex:none}
.r5-tip::after{content:attr(data-name);position:absolute;left:0;bottom:calc(100% + 2px);white-space:nowrap;background:#000;box-shadow:0 0 0 1px #2f3238;color:#fff;padding:5px 9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:9}
.r5-tip:hover::after,.r5-tip:focus-visible::after{opacity:1}
.r5-float{position:relative;z-index:4;flex:1;min-height:0;width:440px;box-sizing:border-box;padding:0 0 12px 16px;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:14px;pointer-events:none}
.r5-float>*{flex:none}
.r5-float .r5-tip,.r5-float img{pointer-events:auto}
.r5-float .r5-tip img{pointer-events:none}
.r5-rule{height:1px;width:312px;background:#1e2024}
.r4-chip{border:0!important;background:none!important;box-shadow:inset 0 -1px 0 transparent;color:#9a9ea6;padding:0 8px 0 0;min-height:52px}
.r4-chip:hover{color:#fff}
.r4-chip.on{color:#fff;box-shadow:inset 0 -2px 0 #ff4fa3}
.r5-prism{font-family:'Michroma',sans-serif;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#fff;text-shadow:-1px 0 0 #e0389a,1px 0 0 #26bcc4;white-space:nowrap}
.r5-lring{font-family:'Michroma',sans-serif;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#fff;display:flex;align-items:center;white-space:nowrap}
.r5-lstack{display:flex;flex-direction:column;gap:1px;line-height:1;white-space:nowrap}
</style>
</helmet>
<div class="{{rootCls}}"><header class="r4-head"><sc-if value="{{logoPoster}}" hint-placeholder-val="{{ true }}"><img src="/_blob/75f47cb7d0b52697a19f26032d590663" alt="Last Stable Orbit" class="r3-px" style="width: 326px; height: 21px;"></sc-if>
<sc-if value="{{logoPrism}}" hint-placeholder-val="{{ false }}"><span class="r5-prism">Last Stable Orbit</span></sc-if>
<sc-if value="{{logoRing}}" hint-placeholder-val="{{ false }}"><span class="r5-lring" aria-label="Last Stable Orbit">Last Stable&nbsp;<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="overflow: visible; margin: 0 1px 0 -1px;"><circle cx="12" cy="12" r="4.5" fill="#000" stroke="#fff" stroke-width="1"></circle><ellipse cx="12" cy="12" rx="11" ry="4" fill="none" stroke="#fff" stroke-width="1.25" transform="rotate(-22 12 12)"></ellipse><circle cx="21.6" cy="8.2" r="1.7" fill="#ff4fa3"></circle></svg>rbit</span></sc-if>
<sc-if value="{{logoStack}}" hint-placeholder-val="{{ false }}"><span class="r5-lstack"><span style="font-family: 'Michroma', sans-serif; font-size: 8px; letter-spacing: .36em; color: #c4b0ff;">LAST STABLE</span><span style="font-family: 'Jost', sans-serif; font-weight: 200; font-size: 28px; letter-spacing: .3em; color: #ffffff;">ORBIT</span></span></sc-if>
<nav aria-label="Sections" class="r4-tabs"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><a class="{{t.cls}}" href="{{t.href}}" aria-current="{{t.cur}}">{{t.name}}</a></sc-for></nav>
</header><div style="flex: 1; display: flex; min-height: 0;"><aside aria-label="Character sheet" class="r4-col" style="width: 268px; padding-right: 12px;"><div role="img" aria-label="Ves. HP {{me.hp}} of 6, Entropy {{me.en}} of 6" style="position: relative; width: 216px; height: 216px; align-self: center; flex: none;"><img src="{{me.img}}" alt="" class="r3-px" style="position: absolute; left: 12px; top: 12px; width: 192px; height: 192px; border-radius: 50%;"><svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;"><sc-for list="{{meRing.arcs}}" as="a" hint-placeholder-count="2"><path d="{{a.d}}" fill="none" stroke="{{a.c}}" stroke-width="{{a.w}}" stroke-linecap="{{a.cap}}" opacity="{{a.o}}"></path></sc-for><sc-for list="{{meRing.dots}}" as="q" hint-placeholder-count="0"><circle cx="{{q.x}}" cy="{{q.y}}" r="{{q.r}}" fill="{{q.f}}" stroke="{{q.c}}" stroke-width="{{q.w}}"></circle></sc-for></svg></div><div style="flex: none;"><div class="r4-name">Vesna Dragan</div><div class="r5-role">The Thief</div></div><section aria-label="Stats" style="flex: none; display: flex; flex-direction: column;"><sc-for list="{{stats}}" as="s" hint-placeholder-count="6"><button type="button" class="r5-srow" onClick="{{s.open}}" aria-label="{{s.aria}}"><img src="{{s.icon}}" alt="" class="r3-px" style="width: 48px; height: 48px;"><span class="r4-lab" style="flex: 1; text-align: left; padding-left: 10px; font-size: 9px;">{{s.name}}</span><img src="{{s.src}}" alt="" class="r3-px r4-sdie" style="width: 48px; height: 48px;"></button></sc-for></section><section style="flex: none; margin-top: 2px;"><section aria-label="On hand" class="r5-items"  style="flex: none;"><sc-for list="{{items}}" as="i" hint-placeholder-count="4"><img src="{{i.src}}" alt="{{i.name}}" title="{{i.name}}" class="r3-px" style="width: 48px; height: 48px;"></sc-for></section></section></aside><div style="flex: 1; min-width: 0; display: flex; flex-direction: column;"><section aria-label="Current location map" style="position: relative; flex: 1; min-width: 0; overflow: hidden; background: #000000;"><div onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerLeave="{{onUp}}" onWheel="{{onWheel}}" onDoubleClick="{{fit}}" style="position: absolute; inset: 0; cursor: {{cursor}}; touch-action: none; user-select: none; -webkit-user-select: none;">
<div style="position: absolute; left: 0; top: 0; width: 2560px; height: 1440px; isolation: isolate; transform-origin: 0 0; transform: {{worldTransform}};">
<div role="img" aria-label="The Event Horizon seen from above at an angle: a long bar under a neon sign, four white slot machines, round tables, red booths, a gold mural over an old round table behind a brass rail, a door to the street and a stockroom."></div>
<sc-for list="{{bases}}" as="b" hint-placeholder-count="3"><img class="r3-map" src="{{b.src}}" alt="" draggable="false" style="opacity: {{b.op}};"></sc-for>
<sc-for list="{{glows}}" as="b" hint-placeholder-count="3"><div class="r3-glow" style="opacity: {{b.op}};"><img class="r3-hum" src="{{b.src}}" alt="" draggable="false"></div></sc-for>
<sc-for list="{{toks}}" as="t" hint-placeholder-count="11">
<button type="button" class="r3-tok" onPointerDown="{{t.down}}" onClick="{{t.select}}" aria-label="{{t.name}}" style="left: {{t.x}}px; top: {{t.y}}px; transform: scale({{t.scale}}); z-index: {{t.z}};">
<span style="position: absolute; left: 50%; bottom: 0; width: 34px; height: 16px; margin-left: -17px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid {{t.foot}}; background: rgba(0,0,0,.35);"></span>
<span style="position: absolute; left: 50%; bottom: 8px; width: 1.5px; height: 36px; margin-left: -.75px; background: {{t.foot}};"></span>
<span style="position: absolute; left: 0; top: 0; width: 64px; height: 64px;"><img src="{{t.img}}" alt="" draggable="false" style="position: absolute; left: {{t.r.p}}%; top: {{t.r.p}}%; width: {{t.r.d}}%; height: {{t.r.d}}%; border-radius: 50%; background: #000; pointer-events: none;"><svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;"><sc-for list="{{t.r.arcs}}" as="a" hint-placeholder-count="2"><path d="{{a.d}}" fill="none" stroke="{{a.c}}" stroke-width="{{a.w}}" stroke-linecap="{{a.cap}}" opacity="{{a.o}}"></path></sc-for><sc-for list="{{t.r.dots}}" as="q" hint-placeholder-count="0"><circle cx="{{q.x}}" cy="{{q.y}}" r="{{q.r}}" fill="{{q.f}}" stroke="{{q.c}}" stroke-width="{{q.w}}"></circle></sc-for></svg></span>
</button>
</sc-for>
</div>
</div>
<div style="position: absolute; left: 16px; bottom: 14px; pointer-events: none;"><div class="r4-place">The Event Horizon</div><div style="color: var(--dim); margin-top: 2px;">Deck 2, the Promenade</div></div><nav aria-label="Crew" style="position: absolute; right: 16px; top: 0; display: flex; flex-direction: column; gap: 8px; align-items: center;">
<sc-for list="{{crew}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.select}}" aria-label="{{c.label}}" style="background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;">
<span style="position: relative; display: block; width: 64px; height: 64px;"><img src="{{c.img}}" alt="" draggable="false" style="position: absolute; left: {{c.r.p}}%; top: {{c.r.p}}%; width: {{c.r.d}}%; height: {{c.r.d}}%; border-radius: 50%; background: #000; pointer-events: none;"><svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;"><sc-for list="{{c.r.arcs}}" as="a" hint-placeholder-count="2"><path d="{{a.d}}" fill="none" stroke="{{a.c}}" stroke-width="{{a.w}}" stroke-linecap="{{a.cap}}" opacity="{{a.o}}"></path></sc-for><sc-for list="{{c.r.dots}}" as="q" hint-placeholder-count="0"><circle cx="{{q.x}}" cy="{{q.y}}" r="{{q.r}}" fill="{{q.f}}" stroke="{{q.c}}" stroke-width="{{q.w}}"></circle></sc-for></svg></span>
<span class="{{c.cls}}">{{c.name}}</span>
</button>
</sc-for>
</nav><sc-if value="{{hasSel}}" hint-placeholder-val="{{ false }}">
<aside aria-label="{{sel.name}}" style="position: absolute; right: 100px; top: 8px; width: 290px; background: #000; box-shadow: 0 0 0 1px #1e2024; box-sizing: border-box; padding: 14px; z-index: 5;">
<div style="display: flex; gap: 12px; align-items: center;"><img src="{{sel.img}}" alt="" class="r3-px" style="width: 96px; height: 96px;"><div style="min-width: 0;"><div class="r4-h" style="font-size: 16px; line-height: 1.2;">{{sel.name}}</div><div class="r5-role">{{sel.role}}</div></div></div>
<div style="margin: 10px 0 12px; line-height: 1.3;"><span style="color: var(--dim);">{{sel.mood}}.</span> {{sel.note}}</div>
<div style="display: flex; gap: 6px;"><button type="button" class="r4-btn">Codex</button><button type="button" class="r4-btn" onClick="{{closeCard}}" style="margin-left: auto;">Close</button></div>
</aside></sc-if></section><section aria-label="Skills and chrome" class="r5-strip"><sc-for list="{{list}}" as="k" hint-placeholder-count="5"><div class="r5-scell"><img src="{{k.icon}}" alt="" class="r3-px" style="width: 48px; height: 48px;"><span>{{k.name}}</span></div></sc-for></section></div></div><sc-if value="{{isOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Roll" style="position: absolute; inset: 0; z-index: 20; background: #000000; overflow: hidden;">
<sc-if value="{{isPick}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;">
<div style="display: flex; align-items: flex-end; justify-content: center; gap: 28px; height: 380px;">
<sc-for list="{{pickStats}}" as="s" hint-placeholder-count="6">
<button type="button" onClick="{{s.pick}}" aria-label="{{s.aria}}" style="position: relative; background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 164px;">
<sc-if value="{{s.on}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 50%; bottom: 0; width: 380px; height: 430px; margin-left: -190px; background: linear-gradient(to top, {{s.col}}, transparent); opacity: .24; clip-path: polygon(48.5% 0, 51.5% 0, 100% 100%, 0 100%); pointer-events: none;"></span></sc-if>
<span style="position: relative; display: flex; align-items: flex-end; justify-content: center; height: 144px;"><img src="{{s.src}}" alt="" class="{{s.cls}}" style="width: {{s.size}}px; height: {{s.size}}px;"></span>
<img src="{{s.icon}}" alt="" class="r3-px" style="position: relative; width: 48px; height: 48px;">
<span class="{{s.lab}}" style="position: relative;">{{s.name}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 22px; max-width: 1200px; padding: 0 16px;">
<sc-for list="{{pickSkills}}" as="k" hint-placeholder-count="5"><button type="button" class="{{k.cls}}" onClick="{{k.toggle}}" aria-pressed="{{k.press}}"><img src="{{k.icon}}" alt="" class="r3-px" style="width: 48px; height: 48px;"><span>{{k.name}}</span></button></sc-for>
</div>
<button type="button" class="r4-cta" onClick="{{rollIt}}" disabled="{{rollOff}}">Roll it</button>
</div>
</sc-if>
<sc-if value="{{isStage}}" hint-placeholder-val="{{ false }}">
<canvas ref="{{setCv}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block;"></canvas>

  const MESH = {};
  function mesh(sides) {
    if (MESH[sides]) return MESH[sides];

    for (let i = 0; i < V.length; i++) for (let j = i + 1; j < V.length; j++) for (let k = j + 1; k < V.length; k++) {
      let n = cross(sub(V[j], V[i]), sub(V[k], V[i]));
      if (Math.hypot(n[0], n[1], n[2]) < 1e-6) continue;

      if (!ok) continue;

  // ---------- physics: impulses on vertices against the deck and walls ----------
  function simulate(sides, value, seed, aspect, power) {
    power = power || 1;

        if (P[1] > BY) planes.push([[0, -1, 0], P[1] - BY]);

          const rn = cross(r, n), den = 1 + dot(rn, rn) / I, j = -(1 + e) * vn / den;

          const vp2 = add(v, cross(w, r)), vt = sub(vp2, mul(n, dot(vp2, n))), vtl = Math.hypot(vt[0], vt[1], vt[2]);

  // ---------- shared drawing ----------

    // TECH: a terminal fills at typing-mash speed, one command's output lands centred and collapses to the number

  proj(X, Y, Z) { return [((X - Y) * 30 + 536) * 2, ((X + Y) * 15 - Z * 36 + 201) * 2]; }

  }

        r: d0.crew ? this.ring(rk, d0.hp, en, 64, 9) : npc(d0.col, 64, 5),
        down: (e) => { e.stopPropagation(); this.dragged = false; this.setState({ tokDrag: { id: d0.id, sx: e.clientX, sy: e.clientY, ox: p.x, oy: p.y } }); },
        select: () => { if (!this.dragged) this.setState({ sel: this.state.sel === d0.id ? null : d0.id }); }
      });
    });
    const by = (id) => toks.find((t) => t.id === id);
    const me = by('ves');
    const crew = ['lale', 'marlo', 'tally', 'ves', 'tomo'].map((id) => {

    });
    const S = this.stats();

      { name: 'Nobody looks at the small woman', icon: '/_blob/44fc57b486fd7ae5940105ffbf9a3b0e' },

    const roll = st.roll, nat1 = !!(roll && roll.rolls[0] === 1), exploded = !!(roll && roll.rolls.length > 1), gain = exploded ? 2 : 1;

    let breakdown = '';

    const IMG = { open: ['/_blob/47158da971c4f2937f3d16de862f5f9e', '/_blob/e4e226280eefc41fbdd8d2ada6c8fff8'], after: ['/_blob/5a7a4e099f6e204725bdd4ca4a5414ec', '/_blob/e23283b74b088ee5958af3cc8779f38d'], stand: ['/_blob/0e0ed6a073a45188da837896c4315330', '/_blob/7f451c4434b3bc8a6fc6d52fd5eaa792'] };

        { name: 'Vault 3 chit', src: '/_blob/fe82c5d936a26b4de8d90f27595cd9b1' }

      cursor: st.drag ? 'grabbing' : 'grab',
      onDown: (e) => { this.setState({ drag: { x: e.clientX, y: e.clientY, px: st.px, py: st.py } }); },
      onMove: (e) => {

      isOpen: st.phase !== 'closed', isPick: st.phase === 'pick', isStage: st.phase === 'rolling' || st.phase === 'done', isRolling: st.phase === 'rolling', isDone: st.phase === 'done',
      pickStats: S.map((s) => {

          pick: () => this.setState({ pick: s.name, jig: st.jig + 1 })

      }),
      pickSkills: list.map((k, i) => ({ name: k.name, icon: k.icon, cls: st.skill === i ? 'r4-item r4-chip on' : 'r4-item r4-chip', press: st.skill === i ? 'true' : 'false', toggle: () => this.setState({ skill: st.skill === i ? -1 : i, jig: st.jig + 1 }) })),

      }),
