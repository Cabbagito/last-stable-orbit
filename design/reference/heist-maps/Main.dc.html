<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck 9: the founder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 1110px; height: 700px; background: #000000; position: relative; overflow: hidden; font-family: system-ui, sans-serif">
  <sc-if value="{{showDay}}" hint-placeholder-val="{{ false }}"><img src="/_blob/1d0693033a8307390f16bf7f0553bbad" alt="Deck 9 by day" style="position: absolute; left: 0; top: 0; width: 1110px; height: 700px; image-rendering: pixelated"></sc-if>
  <sc-if value="{{showNight}}" hint-placeholder-val="{{ true }}"><img src="/_blob/207e39cec6967a83bc6eedde4ddd1374" alt="Deck 9 at night: the founder's office with the signet in its case, the putting green, the gallery" style="position: absolute; left: 0; top: 0; width: 1110px; height: 700px; image-rendering: pixelated"></sc-if>
  <sc-if value="{{showAlert}}" hint-placeholder-val="{{ false }}"><img src="/_blob/f700117440990ddb0d6c2e0e298c3fdb" alt="Deck 9 on alert" style="position: absolute; left: 0; top: 0; width: 1110px; height: 700px; image-rendering: pixelated"></sc-if>
  <div style="position: absolute; left: 16px; top: 16px; display: flex; gap: 4px; padding: 4px; background: #0a0c12; border: 1px solid #2a3040">
    <button type="button" onClick="{{pickDay}}" aria-pressed="{{dayOn}}" style="height: 44px; min-width: 76px; border: 0; font: inherit; font-size: 14px; cursor: pointer; background: {{dayBg}}; color: {{dayFg}}">Day</button>
    <button type="button" onClick="{{pickNight}}" aria-pressed="{{nightOn}}" style="height: 44px; min-width: 76px; border: 0; font: inherit; font-size: 14px; cursor: pointer; background: {{nightBg}}; color: {{nightFg}}">Night</button>
    <button type="button" onClick="{{pickAlert}}" aria-pressed="{{alertOn}}" style="height: 44px; min-width: 76px; border: 0; font: inherit; font-size: 14px; cursor: pointer; background: {{alertBg}}; color: {{alertFg}}">Alert</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1110,"height":700}}'>
class Component extends DCLogic {
  state = { mood: 'night' };
  renderVals() {
    const m = this.state.mood;
    const bg = (k) => (m === k ? '#ff6aa8' : '#141a26');
    const fg = (k) => (m === k ? '#0b0e14' : '#e9edf6');
    return {
      showDay: m === 'day', showNight: m === 'night', showAlert: m === 'alert',
      dayOn: m === 'day', nightOn: m === 'night', alertOn: m === 'alert',
      dayBg: bg('day'), nightBg: bg('night'), alertBg: bg('alert'), dayFg: fg('day'), nightFg: fg('night'), alertFg: fg('alert'),
      pickDay: () => this.setState({ mood: 'day' }), pickNight: () => this.setState({ mood: 'night' }), pickAlert: () => this.setState({ mood: 'alert' }),
    };
  }
}
</script>
</body>
</html>
