# The GM's soundboard: each heading is a button on the GM's top bar, and its sounds are what that button opens.
# Sounds play only on the TV. Ids have to be unique across the whole board.

- id: fight
  name: Fight
  sounds:
    - { id: punch, name: Punch, file: sounds/fight/punch.mp3 }
    - { id: punch_heavy, name: Heavy punch, file: sounds/fight/punch_heavy.mp3 }
    - { id: punch_combo, name: Punch combo, file: sounds/fight/punch_combo.mp3 }
    - { id: swing_miss, name: Swing and a miss, file: sounds/fight/swing_miss.mp3 }
    - { id: stun_hit, name: Stun hit, file: sounds/fight/stun_hit.mp3 }
    - { id: metal_bonk, name: Metal bonk, file: sounds/fight/metal_bonk.mp3 }
    - { id: body_fall, name: Body fall, file: sounds/fight/body_fall.mp3 }
    - { id: chair_break, name: Chair break, file: sounds/fight/chair_break.mp3 }
    - { id: bottle_smash, name: Bottle smash, file: sounds/fight/bottle_smash.mp3 }
    - { id: glass_break, name: Glass break, file: sounds/fight/glass_break.mp3 }

