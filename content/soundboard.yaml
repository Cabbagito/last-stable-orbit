    - { id: droid_grumble, name: Grumble, file: sounds/droid/droid_grumble.mp3 }
    - { id: droid_alarm, name: Alarm, file: sounds/droid/droid_alarm.mp3 }
    - { id: main_approach, name: CSAT-1 approach, file: sounds/droid/main_approach.mp3 }
    - { id: main_destroyed, name: CSAT-1 destroyed, file: sounds/droid/main_destroyed.mp3 }
    - { id: spotless_approach, name: CSAT-2+ approach, file: sounds/droid/spotless_approach.mp3 }
    - { id: spotless_destroyed, name: CSAT-2+ destroyed, file: sounds/droid/spotless_destroyed.mp3 }

- id: heist
  name: Heist
  sounds:
    - { id: access_granted, name: Access granted, file: sounds/heist/access_granted.mp3 }
    - { id: access_denied, name: Access denied, file: sounds/heist/access_denied.mp3 }
    - { id: hacking, name: Hacking, file: sounds/heist/hacking.mp3 }
