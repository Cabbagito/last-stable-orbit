# Session 4 or 5, the final sequence: the crew come out of the old founder-era passages into the Lift station. Two of
# the fixer's hired guns hold the blast door, the first fight. Lucan waits hidden alone on the glass floor behind it, for
# the final fight once the door opens (the Door open mood). The spider mech and Lucan's dog wait hidden together in the
# freight hall, for when the crew skipped the probe run and Peter wants them here instead. The station above is hunting
# them, the same as for the probe run. The cab and the terminal have nobody in them. DRAFTS.
