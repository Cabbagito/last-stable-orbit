# Session 4 opens where Session 3 ends: the bar after hours, the Seal's box open in the founder's table, and the crew sat
# round it with Dax behind them and his shotgun. Unit 14 is in its corner, the cleaner that sees it. The fixer's hired
# guns, Lucan, his brute and his dog wait hidden in the black past the street door, for when they storm in (switch the bar
# to Last stand for the fight, and the Hatch for the way out). Upstairs is the heist's night, now on alert. DRAFTS.
