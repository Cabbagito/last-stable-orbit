# Act 4 opens where Act 3 ends: the bar in Last stand, house lights dead, the Seal's box open in the founder's table,
# and the crew sat round it with Dax behind them and his shotgun. Unit 14 is in its corner, the cleaner that sees it. The
# fixer's hired guns, Lucan, his brute and his dog wait hidden in the black past the street door, for when they storm in
# (the Hatch switch is the way out). Outside, the mercenaries already hold the station: the takeover, the same as on
# The hidey-hole, with Irena hidden behind the boiler in the Bot bays. DRAFTS.
