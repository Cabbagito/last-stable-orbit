# there waiting. Across the room two mercenaries hold the mech's techs and guards in the empty frame (the Alert art): the
# mech has just gone up the freight lift. Up in the bar it's Last stand with the hatch open: Lucan, his brute and his
# hired guns, and no Dax. Everywhere else is the takeover, the same as on The shotgun. DRAFTS.
