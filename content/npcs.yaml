# NPCs that can stand on a map. mood and note show on the NPC card for everyone who can see the token.
# gm_note is only ever sent to the GM. color is the token ring: crew pink, the fixer's people red,
# Dax amber, ISCO's side white-violet, ordinary residents dusk grey.
# codex names the NPC's Codex entry (content/codex.yaml); the card shows a Codex button once that entry is unlocked.
# stats: the die for each stat, like the crew's. The GM rolls an NPC by stat. Only the GM ever sees them.
# health: shown only as its HP ring, while it's in a fight (M8). The enemies' come from the bible; the rest are drafts.
# The dice are DRAFTS from Round 12 of the UI canvas, for Peter to set.

