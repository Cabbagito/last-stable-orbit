# The Executive floors, the Secure floor and the Bot bays (M5). DRAFTS, for Peter to set.
- id: scientist
  name: The scientist
  role: Scientist, the company
  portrait: portraits/scientist.gif
  codex: scientist
  color: "#f2b544"
  stats: {body: 4, reflex: 6, tech: 12, intel: 20, cool: 8, empathy: 8}
  health: 2  # DRAFT for Peter
  mood: Tired
  note: Talks to her plots more than to people.
  gm_note: "Decades of ISCO's answers trace back to a handful of events, and the 0.49 plot. She can't prove it; she filed it once and got promoted. She built the probe, and the company confiscated it. Keeps her findings in a hidden folder in her room, and is quietly friends with Dax. After the bar, she finds the crew in the Bot bays."

- id: old-man
  name: The old man
  role: The founder's assistant
  portrait: portraits/steward.gif
  codex: old-man
  color: "#8f88a3"
  stats: {body: 4, reflex: 4, tech: 6, intel: 12, cool: 12, empathy: 12}
  health: 2  # DRAFT for Peter
  mood: Awake, for now
  note: Remembers the founder as a young man remembers his boss.
  gm_note: "STAND-IN PORTRAIT (the steward's, as on the Maps board); there's no art for him yet. Ilija's young assistant, kept in cryo and thawed two months a year for the charter session, so awake about 50 years. Knows the vault exists, not what's in it. One vote; he has proposed a pause three times and lost. Gives the crew stories of the man behind the saint."

- id: spider-mech
  name: Spider mech
  role: Security, the company
  portrait: portraits/spider-mech.gif
  color: "#7fb4ff"
  size: 2
  stats: {body: 20, reflex: 8, tech: 12, intel: 4, cool: 20, empathy: 4}
  health: 13  # the bible's enemy card
  mood: Dormant
  note: Six legs, a cluster of red lenses, twin guns under its chin.
  gm_note: "The company's boss machine; ISCO doesn't run it. Starts on its cradle, dormant during the break-in. Enemy card: 13 health, d12, Hard to hit, fights alone. Heavy guns, so at least 2 damage. At 6 health or less its shell cracks: Normal to hit, and it attacks with a d20. Weak: Tech at Hard, once, blinds its lenses (it loses its next action and is Normal to hit). Strong: too big to grapple, and ISCO can't shut it down for you."
