# NPCs that can stand on a map. mood and note show on the NPC card for everyone who can see the token.
# gm_note is only ever sent to the GM. color is the token ring: crew pink, the fixer's people red,
# Dax amber, ISCO's side white-violet, ordinary residents dusk grey.
# codex names the NPC's Codex entry (content/codex.yaml); the card shows a Codex button once that entry is unlocked.
# stats: the die for each stat, like the crew's. The GM rolls an NPC by stat. Only the GM ever sees them.
# group: where it sits in the GM's Add list (in the order the groups first appear below). DRAFTS for Peter.
# health: players see it only as its HP ring, while it's in a fight (M8). The GM can set it any time. The enemies' come from the bible; the rest are drafts.
# The dice are DRAFTS from Round 12 of the UI canvas, for Peter to set.
# A line marked DRAFT is wording that isn't in the Campaign Bible, for Peter to edit.

- id: dax
  name: Old Dax
  role: The Keeper
  group: Locals
  portrait: portraits/dax.gif
  color: "#f2b544"
  stats: {body: 12, reflex: 6, tech: 6, intel: 10, cool: 20, empathy: 8}
  health: 3  # DRAFT for Peter
  mood: Watching the door
  note: Keeps one table nobody sits at.
  codex: dax
  gm_note: "His family has kept the founder's table and the bar for 300 years. On day 1 the first of the crew into the bar overhears him and Irena agree to meet \"tomorrow night, at the place\". Session 4 opens at his shotgun: won over, he fights the mercenaries beside the crew, tells them to go and stays for Lucan; if not, they fight without him and leave by the hatch. Lucan kills him either way. Irena's lover; they meet in the hidey-hole behind the Bot bays' boiler. He hates what the slots do to his regulars. Two favours for now: the slots, and the bar fight on day 1. He sees the rope after night one and trusts the crew less on day 2."

- id: fixer
  name: Lucan Merrow
  role: The Fixer
  group: Muscle
  portrait: portraits/fixer.gif
  color: "#ff5a4a"
  stats: {body: 12, reflex: 10, tech: 12, intel: 12, cool: 20, empathy: 4}
  health: 10  # the bible's enemy card
  mood: Patient
  note: Asked nicely.
  codex: fixer
  gm_note: "Uploaded man in a chassis. Thinks a rich client hired him; the client is ISCO. After the bar, ISCO tells him the truth and manipulates him; he stays for the money and kills Dax. Final boss at the lift: 10 health, d20, Savage to hit."
  # His three Burns: only you see them, and their films play only on the TV. No Entropy is tracked; keep count yourself.
  burns:
    - id: legendary-action
      name: Legendary Action
      text: Lucan acts now, out of turn.
      file: films/burns/lucan-legendary-action.mp4
      length: 7.0
    - id: nothing-personal
      name: Nothing personal
      text: The blade hits everyone in his reach, then a missile hits everyone near a spot he picks. 2 damage each (proposed).
      file: films/burns/lucan-nothing-personal.mp4
      length: 9.0
    - id: unfinished-business
      name: Unfinished business
      text: Once, at 0, he goes down, then gets back up for a second phase. His health on return is still open.
      file: films/burns/lucan-unfinished-business.mp4
      length: 14.667

