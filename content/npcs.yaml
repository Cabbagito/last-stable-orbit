  gm_note: "STAND-IN PORTRAIT (the vendor's). A third-party investigator looking into the scrubbed death. He smokes cigars and has refused the survey. Simply trying to solve the case, and asks for help if they find him. He knows of a couple of troublemakers who share mannerisms, possibly one group, and has nothing to do with Marlo's debt. As a joke, he's looking for three other men, and his sketches are all Marlo's faces, with a Cool roll to keep a straight face."

