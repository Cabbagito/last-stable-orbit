# NPCs that can stand on a map. mood and note show on the NPC card for everyone who can see the token.
# gm_note is only ever sent to the GM. color is the token ring: crew pink, the fixer's people red,
# Dax amber, ISCO's side white-violet, ordinary residents dusk grey.
# codex names the NPC's Codex entry; the card shows a Codex button only when it's set (the Codex itself is M6).
# stats: the die for each stat, like the crew's. The GM rolls an NPC by stat. Only the GM ever sees them.
# The dice are DRAFTS from Round 12 of the UI canvas, for Peter to set.

- id: dax
  name: Old Dax
  role: Barkeep
  portrait: portraits/dax.gif
  color: "#f2b544"
  stats: {body: 12, reflex: 6, tech: 6, intel: 10, cool: 20, empathy: 8}
  mood: Watching the door
  note: Keeps one table nobody sits at.
  codex: old-dax
  gm_note: His family has kept the founder's table and the bar for 300 years. Holds the stockroom door in session 4.

- id: fixer
  name: The fixer
  role: Fixer
  portrait: portraits/fixer.gif
  color: "#ff5a4a"
  stats: {body: 12, reflex: 10, tech: 12, intel: 12, cool: 20, empathy: 4}
  mood: Patient
  note: Asked nicely.
  codex: the-fixer
  gm_note: "Uploaded man in a chassis. Thinks a rich client hired him; the client is ISCO. Final boss at the lift: 7 health, d20, Very hard to hit."

- id: cleaner-14
  name: Cleaner Unit 14
  role: Cleaner, ISCO
  portrait: portraits/cleaner-14.gif
  color: "#c9bcff"
  stats: {body: 6, reflex: 8, tech: 12, intel: 10, cool: 20, empathy: 4}
  mood: Delighted
  note: Its eyes slide away once a loop.
  gm_note: "No cameras in the bar, but Unit 14 is always somewhere near the crew's table. ISCO's eyes."

