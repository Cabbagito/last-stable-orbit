# The Executive floors, the Secure floor and the Bot bays (M5). DRAFTS, for Peter to set.
- id: scientist
  name: Dr. Irena Vos
  role: The Analyst
  group: The company
  portrait: portraits/scientist.gif
  codex: scientist
  color: "#f2b544"
  stats: {body: 4, reflex: 6, tech: 12, intel: 20, cool: 8, empathy: 8}
  health: 2  # DRAFT for Peter
  mood: Tired
  note: Talks to her plots more than to people.
  gm_note: "Decades of ISCO's answers trace back to a handful of events, and the 0.49 plot. She can't prove it; she filed it once and got promoted. She built the probe, and the company confiscated it. Keeps her findings in a hidden folder in her room on deck 7, and she's always there. The probe's code is in her head, and she gives it to the crew in session 4. Dax's lover; they meet in the hidey-hole behind the Bot bays' boiler, and she's waiting there in session 4. Fetching Unit 14's log for her earns her trust. During the heist Peter rolls for her on purpose: if she trusts the crew she lets it slide and asks them to find where the probe is kept."

- id: spider-mech
  name: Spider mech
  role: Security, the company
  group: The company
  portrait: portraits/spider-mech.gif
  color: "#7fb4ff"
  size: 2
  stats: {body: 20, reflex: 8, tech: 12, intel: 4, cool: 20, empathy: 4}
  health: 13  # the bible's enemy card
  mood: Dormant
  note: Six legs, a cluster of red lenses, twin guns under its chin.
  gm_note: "The company's boss machine; ISCO doesn't run it. Out of the heist: under repair in the Bot bays from day 2, with techs and guards around it, and getting near it weakens it for the probe run (how much is still open). By session 4 it's gone: mercenaries get hold of it and bring it up the freight lift as the boss. Enemy card: 13 health, d12, Hard to hit, fights alone. Heavy guns, so at least 2 damage. At 6 health or less its shell cracks: Normal to hit, and it attacks with a d20. Weak: Tech at Hard, once, blinds its lenses (it loses its next action and is Normal to hit). Strong: too big to grapple, and ISCO can't shut it down for you."

