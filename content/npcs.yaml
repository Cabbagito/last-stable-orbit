  gm_note: "ISCO holds Dock 7 at exactly 11:00, the longest wait its dashboard doesn't count. A log says: \"I set the alarm at eleven minutes.\" Friendly, asks why they've come, hands over the brochure, and gives each of them a pointer it shouldn't know to give: Lale to the Concierge's desk (\"I'm sorry about your patient\"), Marlo to the Night Market's crowds, Tally to the bar's four machines, Tomo to the only real oven, and Ves away from the side alley, closed for cleaning."

