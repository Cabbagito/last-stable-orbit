# Cutscenes: full-screen pixel films, in the order you'll use them. You start one from the GM tab and it plays
# to the end, with no controls. Each is one video file with its sound baked in (see the doc "LSO — Cutscenes
# and Stage"). A cue with no file isn't made yet: it shows in the list, greyed out.
#
# `act` is the heading the cue sits under in the GM's list. The last films are "Final act" because that's act 4 or
# 5, depending on whether the crew go for the probe.
#
# `sets` is what the cue sets behind the film, so play resumes in the right place when it ends: the map (the
# party looks at it), its mood and switches, and NPCs placed where the film leaves them. The crew stay put: when
# a film ends on another map, the GM sends them there (Scene, "Send the crew here"), which also works while it plays.
# Positions are drafts for Peter to adjust.
#
# The opening (the waiting loop and the intro film) is not a cue: it has its own step on the GM's Session page. See opening.yaml.

- id: lucan
  name: Enter the Fixer
  act: "Act 1: The Pitch"
  sub: 40 s, session 1, before the pitch
  ends: Ends on Lucan seated under the mural, in the founder's set place, with the rope down and Dax gone. Send the crew to their chairs at the founder's table.
  file: films/lucan.mp4
  length: 40.0
  still: films/lucan-still.png
  sets:
    map: event-horizon
    mood: after
    tokens:
      - {ref: fixer, at: [1.397, 4.51, 0.24]}

- id: act-1
  name: Loose Ends
  act: "Act 1: The Pitch"
  sub: 70 s, closes session 1
  ends: Ends on Dax looking at the rope, then the card, "Whatever brought you here, we hope you find what you came for." and "End of Act 1".
  file: films/act-1.mp4
  length: 70.0
  still: films/act-1-still.png

