# The opening: the waiting loop, then the intro film, on the GM's Session page.
#
# While it's on, the TV loops the stars and the music and players' laptops show only that loop, silent. The GM's Play
# starts the film on the music's next beat, and when the film ends everyone is let into the game.
#
# Unlike a cue, its sound is a separate file: `audio` is the 96 s music loop, then the film's 212.25 s of sound, back
# to back, so the loop repeats seamlessly and the film's sound lands on the beat. The numbers below have to match
# OPENING in web/src/stage/opening_player.js, which came with the files.

name: "The opening"
sub: "3:32, opens the campaign"
loop: films/opening-loop.mp4
film: films/opening.mp4
audio: films/opening-audio.flac
still: films/opening-still.png
length: 212.25
beat: 0.75  # Aphelion is exactly 80 bpm
