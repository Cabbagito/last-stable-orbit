# The Codex: five sections and their pages. Layout from the UI canvas, page "Codex, pinned" (boards Cdx3*).
# ALL TEXT IS DRAFT, from the Campaign Bible, for Peter to edit. Ves's history and "how she works" are placeholders.
#
# Players see an entry only once the GM unlocks it (GM tab, Codex), for the whole crew. A block with `locked: true`
# stays hidden until it's unlocked too, so a page grows. Presets list what's unlocked when they load (`codex:`).
# A page never lists what anyone carries. `crew:`, `npc:` or `item:` ties a page to that sheet: a crew page shows
# its stats, health, skills and Burn, an NPC's its mood.
#
# art: how the picture sits on the card and the page, as the boards place it.
#   kind bust: a 96 px portrait. kind icon: a 48 px icon. kind crop (the default): a piece of a bigger picture,
#   with px (its width), cx (the x to centre on), y0 (the y at the card's top), k (card zoom), km (See also zoom),
#   pos (where the page's picture is anchored) and z (the page's zoom).
# see: other entries, by id. A locked one is left out for players.

