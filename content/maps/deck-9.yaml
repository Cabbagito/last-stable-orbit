  - {k: "4", label: "Stairs down to deck 8", at: [18.15, 2.65, 0.89]}
  - {k: "5", label: "The gallery: four cases, cover to hide behind", at: [13.25, 4.08, 0.14]}
  - {k: "6", label: "Putting green, a minigame like the slots. The hole's by the duct", at: [0.45, 11.88, 0.08]}
  - {k: "A", label: "Case 1: a model of Ergo, the first design", at: [12.22, 1.92, 1.39]}
  - {k: "B", label: "Case 2: his old pressure-suit helmet", at: [15, 2, 1.47]}
  - {k: "C", label: "Case 3: the Ergo plans, the original blueprints", at: [12.37, 5.1, 1.22]}
  - {k: "D", label: "Case 4: his first terminal, still on", at: [15, 5, 1.53]}
  - {k: "E", label: "The portrait of the founder", at: [13.47, 0, 2]}
  - {k: "F", label: "His desk, armchairs and long-case clock", at: [5.67, 3.67, 0.78]}
  - {k: "G", label: "The camera, on a pole", at: [19.2, 8.47, 2.75]}
  - {k: "H", label: "Armchairs and golf caddy by the green", at: [10.5, 12.83, 0.56]}
