# Deck 9, from the Heist maps canvas (board "Deck 9: the founder"). Art is 1110x700, drawn at 2x.
# The shared isometric formula, with origin (460, 150). The floor is X 0 to 20, Y 0 to 14.
id: deck-9
name: "Deck 9: the founder"
subtitle: The top of the Executive floors
description: >-
  Deck 9 seen from above at an angle: a raised old wood office with a wall of books, a desk and one glass case,
  a gallery of four lit cases and a huge gold portrait, and a long putting green with one hole.
display: [2220, 1400]
origin: [460, 150]
order: 7
hum: none
moods:
  - {id: day, label: Day, base: maps/deck-9/base-day.png}
  - {id: night, label: Night, base: maps/deck-9/base-night.png}
  - {id: alert, label: Alert, base: maps/deck-9/base-alert.png}
  # Act 4, the mercenaries holding the station: Alert, shot up (scripts/takeover_floors.py). Nothing has moved
  - {id: takeover, label: Takeover, base: maps/deck-9/base-takeover.png}
objects:  # things players can inspect, once the GM reveals them. DRAFT texts, for Peter to edit.
  - id: signet
    name: "The signet"
    at: [2.27, 6.07, 1.31]
    closeup: [692, 455.88]
    text: "The founder's signet, on velvet in a glass case at the heart of his office. Old gold, heavy, cut to press into something."
  - id: office-door
    name: "The office door"
    at: [9.93, 5.93, 1.33]
    closeup: [1160, 680.04]
    text: "Old wood and a brass handle, and it's locked. Everyone on this deck can see it, and so can the camera."
  - id: portrait
    name: "The portrait"
    at: [13.47, 0, 2]
    closeup: [1728.2, 560.1]
    text: "The founder in gold leaf, with a halo. Whoever hung it meant it."
  - id: ergo-model
    name: "A model of Ergo"
    at: [12.22, 1.92, 1.39]
    closeup: [1538, 624.12]
    text: "Under glass: the first design of the station, small enough to carry. Nobody has dusted it by hand in a very long time, and there's no dust."
  - id: helmet
    name: "His helmet"
    at: [15, 2, 1.47]
    closeup: [1700, 704.16]
    text: "His old pressure-suit helmet, scratched at the visor. A card says he wore it on the first walk outside."
  - id: ergo-plans
    name: "The Ergo plans"
    at: [12.37, 5.1, 1.22]
    closeup: [1356.2, 736.26]
    text: "The original blueprints, flat under glass, in a hand that kept changing its mind."
  - id: first-terminal
    name: "His first terminal"
    at: [15, 5, 1.53]
    closeup: [1520, 789.84]
    text: "Still on. A green CRT with a cursor blinking, waiting for someone who isn't coming back."
  - id: putting-green
    name: "The putting green"
    at: [4.18, 12.35, 0.17]
    closeup: [429.8, 783.66]
    text: "The board's own putting green, the length of the deck. One hole, at the far end by the wall."
  - id: duct
    name: "The duct hatch"
    at: [0, 13.27, 0.53]
    closeup: [123.8, 659.94]
    text: "A low hatch in the wall at the far end of the green, behind the hole."
# What's where, from the Heist playground's floor notes. Only the GM sees these.
pins:
