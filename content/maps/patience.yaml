# Patience, the cruise liner at Dock 7, from the Maps canvas (board "SmallPatience", key in "SmallKey").
# Art is 740x490, drawn at 2x. The shared isometric formula, with origin (310, 130).
id: patience
name: Patience
subtitle: The cruise liner, at Dock 7
description: >-
  The Patience seen from above at an angle: a cream corridor with three portholes showing the black hole, a
  brass rail, a lounge with a red sofa and two round tables, a steward's desk and a gangway door marked Dock 7.
display: [1480, 980]
origin: [310, 130]
order: 1
hum: none
moods:
  - {id: docked, label: Docked, base: maps/patience/base.png, glow: maps/patience/glow.png}
objects:  # things players can inspect, once the GM reveals them. DRAFT texts, for Peter to edit.
  - id: portholes
    name: The portholes
    at: [5.24, -0.96, 1.5]
    closeup: [985, 300]
    text: Three brass portholes, and the black hole in every one, turning slowly. The other passengers don't look out.
  - id: steward-desk
    name: The steward's desk
    at: [9.92, 3.92, 0.8]
    closeup: [985, 690]
    text: A polished desk with a little brass lamp.
  - id: vent  # no art for it yet, so no close-up
    name: The vent
    at: [-0.3, 1.0, 0.8]
    text: A small vent, low on the wall just past the sofa. Four brass screws, and nobody watching them.
# The Key board's "what's where" (the SmallKey board's Patience). Only the GM sees these.
