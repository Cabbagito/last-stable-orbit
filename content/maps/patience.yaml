  - {k: "2", label: Gangway to Dock 7, at: [10.2, 9.0, 1.2]}
  - {k: "3", label: The steward's desk, at: [9.92, 3.92, 0.8]}
  - {k: A, label: Lounge tables, at: [2.68, 3.68, 0.6]}
  - {k: B, label: Brass rail, at: [4.2, 1.5, 0.8]}
  - {k: C, label: Sofa, at: [-0.34, 3.96, 0.5]}
  - {k: D, label: The ship's name on the wall, at: [4.04, -1.56, 2]}
  - {k: E, label: "The vent: the burner key is inside (hand it to Ves from Pockets)", at: [-0.3, 1.0, 0.8]}
