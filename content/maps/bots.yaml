  - {k: "1", label: "Charging cradles, primes only, empty so cleaners can be tokens", at: [3.14, -2.16, 1]}
  - {k: "2", label: "Ladder down from Dax's hatch", at: [-1.62, 6.08, 2]}
  - {k: "3", label: "Service door: the way around", at: [13.76, 4.76, 1.2]}
  - {k: "4", label: "Cradle 14, the exception", at: [10.44, -2.16, 1]}
  - {k: A, label: The spotless strip in a dirty deck, at: [9.44, 2.14, 0]}
  - {k: B, label: Boiler and pipes, at: [-0.44, 3.16, 1.5]}
  - {k: C, label: Drums, at: [10.84, 7.24, 0.6]}
