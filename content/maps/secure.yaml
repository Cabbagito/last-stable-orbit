# The Secure floor, from the Heist maps canvas (board "The Secure floor"). Art is 1660x1010, drawn at 2x.
# The shared isometric formula, with origin (700, 150). The floor is X 0 to 30, Y 0 to 22.
id: secure
name: The Secure floor
subtitle: Behind the guarded door on deck 8
description: >-
  The Secure floor seen from above at an angle: a red runner through a wide hall of crates and pews to an old gold
  vault door with flowers and a brass rail, a caged lockup with one lit case, a guard room, a store of flowers, and a
  freight lift beside an empty hazard-striped cradle.
display: [3320, 2020]
origin: [700, 150]
order: 8
hum: none
moods:
  - {id: day, label: Day, base: maps/secure/base-day.png}
  - {id: night, label: Night, base: maps/secure/base-night.png}
  - {id: alert, label: Alert, base: maps/secure/base-alert.png}
switches:
  - {id: cameras, label: Cameras, type: bool}
cameras:  # one, up in the hall, on the vault door. From the Heist playground's coverage.
  switch: cameras
  bounds: [0, 0, 30, 22]
  steps: 12
  color: "#7fb4ff"
  cones:
    - {at: [20.6, 9.6], deg: -128, spread: 40, reach: 9}
objects:  # things players can inspect, once the GM reveals them. DRAFT texts, for Peter to edit.
  - id: vault-door
    name: "The vault door"
    at: [14.67, 0, 1.25]
    closeup: [2280.2, 650.1]
    text: "Old gold, with the founder's ring and black disc, on a raised floor of old wood behind a brass rope rail. A slot, and a hand plate."
  - id: probe
    name: "The probe"
    at: [2.07, 2.07, 1.31]
    closeup: [1400, 329.88]
    text: "In one lit case at the back of the lockup, bolted down, with a keypad on the front. A sleek instrument, tagged and sealed."
  - id: freight-controls
    name: "The freight lift controls"
    at: [28.7, 8.97, 1.19]
    closeup: [2583.8, 1344.42]
    text: "A lit post by the lift. The only controls it has, so it can be sent down from here but never called up."
  - id: cradle
    name: "The cradle"
    at: [27.08, 4.58, 0.14]
    closeup: [2750, 1239.72]
    text: "A charging cradle built for something big, marked out in hazard stripes. Empty."
  - id: vent
    name: "The vent"
    at: [29.33, 0, 0.42]
    closeup: [3159.8, 1149.66]
    text: "A grille low in the wall by the old scanner. It looks loose."
  - id: flowers
    name: "The Vigil stores"
    at: [25.17, 17.5, 1.25]
    closeup: [1860.2, 1490.1]
    text: "Crates of flowers and shelves of candles for the Vigil. Plenty of places to stand very still."
  - id: ring
    name: "The founder's ring"
    at: [15.22, 11.32, 0.06]
    closeup: [1634, 1091.88]
    text: "His ring, set into the floor in brass, with the red runner straight across it."
# What's where, from the Heist playground's floor notes. Only the GM sees these.
pins:
  - {k: "1", label: "Vault door: the signet in the slot, Lale's hand on the plate. No route reaches it unseen", at: [14.67, 0, 1.25]}
  - {k: "2", label: "Probe, in the lockup, in a case with a keypad. Irena knows the code", at: [2.07, 2.07, 1.31]}
  - {k: "3", label: "Door from deck 8, the checkpoint's other side", at: [14.67, 22, 0.56]}
  - {k: "4", label: "Freight lift to the Bot bays. Its only controls are here", at: [32.33, 5.67, 0.56]}
  - {k: "5", label: "Freight controls", at: [28.7, 8.97, 1.19]}
  - {k: "6", label: "Vent, for Ves", at: [29.33, 0, 0.42]}
  - {k: "7", label: "The mech's cradle, empty. It's in the Bot bays and comes back up the lift", at: [27.08, 4.58, 0.14]}
  - {k: "A", label: "The silence: visitors fill the floor here, two guards at the door", at: [14.33, 3.67, 0.28]}
  - {k: "B", label: "Guard room: one guard asleep at night", at: [4.92, 18.42, 0.83]}
  - {k: "C", label: "Lockup door", at: [7.08, 8.25, 0.69]}
  - {k: "D", label: "Vigil stores. At night Ahti's crew does the flowers here", at: [25.17, 17.5, 1.25]}
  - {k: "E", label: "Pews along the runner", at: [11.17, 18.83, 0.28]}
  - {k: "F", label: "Founder's ring in the floor", at: [15.22, 11.32, 0.06]}
  - {k: "G", label: "Old scanner booth and barrier arms", at: [26.83, 0.5, 1.39]}
# Where the crew land when you send them here: inside the door from deck 8, in crew order.
arrive: [[13.8, 20.6, 0], [14.8, 20.6, 0], [15.8, 20.6, 0], [14.3, 19.7, 0], [15.3, 19.7, 0]]
