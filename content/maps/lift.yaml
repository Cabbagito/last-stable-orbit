# The Lift station, from the Maps canvas (boards "Lift" and "LiftKey"). Layout and style are locked.
# Art is 1760x1020, drawn at 2x. The shared isometric formula, with origin (800, 170).
id: lift
name: The Lift station
subtitle: The top of the cable
description: >-
  The Lift station seen from above at an angle: a lift's blue doors letting out onto an old wood landing and a small
  alcove with a founder's ring, a
  freight hall with crates, barriers and a loader, a blast door, and a dark platform whose floor is a huge glass
  panel with the black hole directly below it, lighting the room from underneath. Against the left wall, the
  crawler cab stands with its door open and its lights on.
display: [3520, 2040]
origin: [800, 170]
order: 11
hum: none
moods:  # the blast door: shut for the first fight, open for the fixer
  - {id: shut, label: Door shut, base: maps/lift/base-shut.png, glow: maps/lift/glow-shut.png}
  - {id: open, label: Door open, base: maps/lift/base-open.png, glow: maps/lift/glow-open.png}
objects:  # things players can inspect, once the GM reveals them. DRAFT texts, for Peter to edit.
  - id: crawler-cab
    name: The crawler cab
    at: [3.6, 7.5, 3.3]
    closeup: [1366, 435]
    text: The crawler cab stands against the wall with its door open and its lights on. Nobody is anywhere near it.
  - id: glass-floor
    name: The glass floor
    at: [18, 7, 0.05]
    closeup: [2260, 1086]
    text: One huge pane of glass, and the black hole directly under it, lighting the whole platform from below.
  - id: alcove
    name: The alcove
    at: [3.9, 17.5, 0.3]
    closeup: [784, 960]
    text: A bench, a basin and a few supplies, under a founder's ring. It's quiet in here.
# The Key board's "what's where". Only the GM sees these.
