  - {k: "3", label: "Glass floor over the hole: the fixer waits on it, the final fight", at: [18, 7, 0.05]}
  - {k: "4", label: "Crawler cab on the left wall behind him, door open and lit", at: [3.6, 7.5, 3.3]}
  - {k: A, label: "Freight hall: crates, barriers, loader, floor lanes", at: [12.2, 23.2, 2.2]}
  - {k: B, label: "Alcove for the quiet moment: bench, basin, supplies, founder's ring", at: [3.9, 17.5, 0.3]}
  - {k: C, label: Old wood landing and arch into the hall, at: [5.2, 21.8, 0.3]}
