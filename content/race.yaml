# Bot bay racing: the race, and the final against the champion. Two events in the GM tab's Events (overviews.yaml).
# From the canvas LSO — Bot bay racing (https://claude.ai/artifact/5r9V3M158fam1CqMDdEKgn) and the kit Peter handed over
# on Nov 24 (minigames/race_fuel_lines.py, mg_sound.py, mg_music.py, cup_icon.py in the claude.ai Project). Every number
# is the prototype's. The race itself (the track, the director, the caller's lines) is code: web/src/race/sim.ts, ported
# exactly and checked against the prototype's own races.
#
# Each picked player preps a bot on their laptop: dress it, tune it (the server rolls their Tech), burn one item from
# their pockets as fuel (or nothing), and rev. When the last one revs, the TV runs the lights and the race from the seed.
# There is no buy-in, pot or payout anywhere: the players bet out loud and Peter settles it, and hands over the purse
# (150 credits for a race, 300 for the final) and the Satisfaction Cup himself with the Give picker.

map: maps/bots/base-day.png  # the race is drawn over the Bot bays by day
laps: {race: 5, final: 3}
lead: 1.5  # seconds from the last rev to the lights, so the TV hears in time
intro: 3.6  # the final: CSAT-1 rolls in, with his horn, this long before the lights
hold: 14  # seconds the result stays on the TV before it closes

# Each player's bot starts with this name and number, which they can change, and wears the player's colour (their
# portrait's light, as on the canvas).
crew:
  lale: {name: STAT, num: "2", color: "#a8f4c4"}
  marlo: {name: ALIBI, num: "3", color: "#ff8ac4"}
  tally: {name: MEAN, num: "5", color: "#8ef6ff"}
  ves: {name: SHH, num: "7", color: "#ff6a40"}
  tomo: {name: LOAF, num: "11", color: "#ffb050"}
# The parts a new bot starts with, as places in each list (web/src/race/draw.js: SPOILERS, STRIPES and so on).
look: {spoiler: 2, stripes: 1, wheels: 0, topper: 0, face: 0, paint: 0, lights: 0}

# The tune: one roll of the player's Tech die, exploding. A natural 1 is a loose wheel whatever the total.
tunes:
  - {name: LOOSE WHEEL, grip: 0.7}
  - {from: 5, name: STOCK, grip: 1.0}
  - {from: 7, name: TIGHT, grip: 1.15}
  - {from: 9, name: GLUED, grip: 1.3}

# The rev: where the needle sits when the lights go out, 0 to 1. Green is 78 to 88; past it the bot stalls on the line.
# How fast it climbs and falls back are constants on the prep screen (web/src/race/Prep.tsx), the prototype's.
revs:
  - {below: 0.5, name: SLUGGISH, launch: 0.2}
  - {below: 0.78, name: CLEAN, launch: 0.6}
  - {below: 0.88, name: PERFECT, launch: 1}
  - {name: STALLED, launch: -1}

# The house bots fill the grid to five, in colours no player uses.
house:
  - {name: MOPSY, color: "#b79cff", look: {spoiler: 4, stripes: 0, wheels: 0, topper: 0, face: 0, paint: 0, lights: 0}}
  - {name: UNIT 9, color: "#e6e8f0", look: {spoiler: 0, stripes: 1, wheels: 0, topper: 0, face: 2, paint: 0, lights: 0}}
  - {name: BIG SCRUB, color: "#c6e84e", look: {spoiler: 2, stripes: 2, wheels: 1, topper: 2, face: 1, paint: 0, lights: 0}}
  - {name: DUSTIN, color: "#5f8dff", look: {spoiler: 1, stripes: 3, wheels: 2, topper: 1, face: 0, paint: 0, lights: 0}}
  - {name: SIR SUDS, color: "#7fb0a8", look: {spoiler: 3, stripes: 0, wheels: 3, topper: 3, face: 3, paint: 0, lights: 0}}
house_bot: {grip: 1.0, fuel: 1.0, launch: 0.6}
# The champion, in the final.
csat: {name: CSAT-1, color: "#f4ecd4", grip: 1.2, fuel: 1.0, launch: 0.7, portrait: portraits/survey-droid.gif}

# What each kind of fuel does to the bot. Players never see these, before or after: only the line.
effects:
  fast2: {fuel: 1.02}  # QUICK +
  fast: {fuel: 1.012}  # QUICK
  slow: {fuel: 0.99}  # SLOW
  grip: {grip: 0.1}  # GRIP
  loose: {grip: -0.15}  # LOOSE
  chaos: {chaos: true}  # GAMBLE: once, 12 to 26 s in, a coin flip: a huge surge or a smoking stall
  stink: {stink: true}  # STINK: no bot can slipstream behind it
  cup: {fuel: 1.08}  # the Satisfaction Cup: on a stock bot it wins about 65% against four house bots (sim.test.ts)
  none: {}

# Every item, by id: its name on the fuel screen, the line the bot says once it's burned, and its effect.
