# All of it plays on the TV only. Effects at `volume`, the songs at `music_volume`. Each song's file is exactly one loop
# of `bars` bars of 4/4 at `bpm` (test_race.py checks the files). soundboard: the ids of sounds the soundboard already has.
sound:
  dir: race/sound
  volume: 0.9
  music_volume: 0.5
  music:
    grid: {file: music_grid, bars: 8, bpm: 100}
    race: {file: music_race, bars: 32, bpm: 150}
    final: {file: music_final, bars: 32, bpm: 160}
  effects: [lights_go, surge, spin, crash, overheat, flip, kick_up, last_lap, photo_finish, guard, win, champion, retains]
  soundboard: {horn: main_approach, destroyed: main_destroyed, csat2: spotless_approach, survey: droid_question, bottle: bottle_smash}
