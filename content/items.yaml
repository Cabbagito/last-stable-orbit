# Things a character can hold. The GM gives, takes and moves them; players only look.
#   kind:    gear | weapon | tool | cash | key | note | audio
#   text:    the tooltip. Only the holder and the GM ever see it. A clue's text says what it is and what it shows.
#   counted: one entry holding an amount (credits), changed by the GM.
# DRAFT texts from the campaign bible, for Peter to edit.

# --- the starting kit
- id: sidearm
  name: Stun pistol
  icon: icons/items/sidearm.png
  codex: sidearm
  kind: weapon
  text: A compact stun pistol, legal on Ergo with a permit. It puts people down without killing them. Loud when it matters.

- id: stun-rings
  name: Stun rings
  icon: icons/items/stun-rings.png
  codex: stun-rings
  kind: weapon
  text: Heavy signet rings that discharge on contact. They let you use Reflex to hit people, and they put people down without killing them. You have to be within reach.

- id: fob-watch
  name: Fob watch
  icon: icons/items/fob-watch.png
  codex: fob-watch
  kind: gear
  text: A wind-up fob watch, inherited, that keeps its own time whatever the station clocks say. There's a small ring engraved on the back. You've never known what it means.

- id: sourdough-jar
  name: Sourdough starter
  icon: icons/items/sourdough-jar.png
  codex: sourdough-jar
  kind: gear
  text: A jar of sourdough starter, the same culture kept alive through every move. It gets you into kitchens and back rooms, and in with anyone homesick for real bread.

- id: splice-kit
  name: Splice kit
  icon: icons/items/splice-kit.png
  codex: splice-kit
  kind: tool
  text: Wire, clips and a shim set in a soft roll. Talks a door panel into thinking it's already open.

- id: credits
  name: Credits
  icon: icons/items/credits.png
  codex: credits
  kind: cash
  counted: true
  text: Station credits. Good anywhere on Ergo.

# Each character's own letter, from the bible's session 1. The meeting line and each person's terms are the bible's;
# the note and wax sentence and the way the terms are put are DRAFT. Only the holder and the GM ever see one.
- id: letter-lale
  name: Lale's letter
  icon: icons/items/note.png
  codex: letter
  kind: note
  text: |-
    A folded note, sealed with a drop of red wax.
    "The Event Horizon, after closing. You're on the list."
    A slot for your patient.

- id: letter-marlo
  name: Marlo's letter
  icon: icons/items/note.png
  codex: letter
  kind: note
  text: |-
    A folded note, sealed with a drop of red wax.
    "The Event Horizon, after closing. You're on the list."
    Your debts, cleared.

- id: letter-tally
