- id: burner-key
  name: Burner key
  icon: icons/items/burner-key.png
  kind: key
  shelf: useful
  text: A one-use hacking device. It gets through one hack with no roll.

- id: brochure
  name: The brochure
  icon: icons/items/brochure.png
  kind: note
  shelf: clues
